<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EDOCODE • Palindromic Fidget Spinner</title>
  <meta name="description" content="EDOCODE — Static brand mark with spinning palindromic EDO and ODE wings.">
  <link rel="icon" type="image/svg+xml" href="assets/logos/edocode-favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --green: #25D366;
      --green-glow: rgba(37, 211, 102, 0.45);
      --green-subtle: rgba(37, 211, 102, 0.12);
      --white: #FFFFFF;
      --gray-400: #888888;
      --gray-600: #4b5563;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--white);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      position: relative;
      cursor: crosshair;
    }

    /* Ambient background grid */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 64px 64px, 64px 64px;
      pointer-events: none;
      z-index: 1;
    }

    /* Particle canvas for sparks */
    #particles-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Top Brand Bar: Logo in top-left, top-right completely clean */
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: 28px 40px;
      display: flex;
      justify-content: flex-start; /* Clean top-right, logo anchored at top-left */
      align-items: center;
      pointer-events: none;
    }

    .brand-tag {
      display: flex;
      align-items: center;
      text-decoration: none;
      pointer-events: auto;
    }

    /* Prominent Hero Wordmark in Top-Left */
    .brand-hero-logo {
      height: 64px;
      width: auto;
      max-width: 320px;
      object-fit: contain;
      filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.8));
      transition: transform 0.22s ease, opacity 0.22s ease;
    }

    .brand-hero-logo:hover {
      transform: scale(1.03);
      opacity: 0.95;
    }

    /* Main Container: Centered stage */
    main {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
      gap: 24px;
    }

    /* Square Responsive Spinner Stage: Sized to fit BOTH width and height */
    .spinner-wrapper {
      position: relative;
      width: min(76vw, 68vh);
      height: min(76vw, 68vh);
      max-width: 720px;
      max-height: 720px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    /* Master SVG Stage */
    .spinner-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.9));
      transition: filter 0.15s ease-out;
    }

    .spinner-svg.hyperspin {
      filter: drop-shadow(0 0 45px var(--green-glow)) drop-shadow(0 20px 60px rgba(0, 0, 0, 0.95));
    }

    /* Pure Rectangular Stop Button */
    .controls-container {
      position: relative;
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .btn-rect {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #000000;
      border: 1.5px solid var(--green);
      color: var(--white);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 12px 32px;
      border-radius: 0px; /* Pure rectangular shape */
      cursor: pointer;
      box-shadow: 0 0 16px rgba(37, 211, 102, 0.18);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-rect:hover {
      background: var(--green);
      color: #000000;
      box-shadow: 0 0 28px var(--green-glow);
    }

    .btn-rect:active {
      transform: scale(0.97);
    }

    .btn-rect.stopped {
      border-color: #FFFFFF;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.2);
    }

    .btn-rect.stopped:hover {
      background: #FFFFFF;
      color: #000000;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
    }

    /* Big Faded Web-Responsive "COMING SOON" Background Text (Reverse Fade) */
    .bg-coming-soon {
      position: absolute;
      top: 0px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 900;
      font-size: clamp(34px, 11.2vw, 220px);
      letter-spacing: -0.035em;
      line-height: 0.85;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      z-index: 2;
      user-select: none;
      color: rgba(255, 255, 255, 0.22);
      background: linear-gradient(180deg, 
        rgba(255, 255, 255, 0.25) 0%, 
        rgba(255, 255, 255, 0.12) 35%, 
        rgba(255, 255, 255, 0.02) 75%, 
        transparent 96%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.65) 45%, rgba(0, 0, 0, 0) 95%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.65) 45%, rgba(0, 0, 0, 0) 95%);
    }

    /* Floating Interactive Cursor Pill */
    .cursor-pill {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1000;
      background: rgba(10, 10, 10, 0.92);
      border: 1px solid var(--green);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 25px var(--green-glow);
      backdrop-filter: blur(16px);
      padding: 8px 16px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      transition: opacity 0.2s ease;
      opacity: 0;
      transform: translate(-50%, -140%);
    }

    .cursor-pill.visible {
      opacity: 1;
    }

    .cursor-pill .icon {
      font-size: 13px;
      display: inline-block;
      animation: spin-icon 1.5s infinite linear;
    }

    @keyframes spin-icon {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .cursor-pill .text {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--white);
    }

    .cursor-pill .highlight {
      color: var(--green);
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      header {
        padding: 16px 20px;
      }
      .brand-hero-logo {
        height: 48px;
        max-width: 220px;
      }
      .spinner-wrapper {
        width: min(86vw, 58vh);
        height: min(86vw, 58vh);
      }
      .cursor-pill {
        display: none;
      }
      .btn-rect {
        padding: 10px 24px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Grid & Particles -->
  <div class="bg-grid"></div>
  <canvas id="particles-canvas"></canvas>

  <!-- Big Faded Web-Responsive "COMING SOON" Background Text (Reverse Fade) -->
  <div class="bg-coming-soon" aria-hidden="true">COMING SOON</div>

  <!-- Top Brand Bar: Logo in top-left, top-right completely empty -->
  <header>
    <a href="https://edocode.co.in" class="brand-tag" title="EDOCODE">
      <!-- Official Brand Kit edocode-wordmark-hero.svg in Top-Left -->
      <img src="assets/logos/edocode-wordmark-hero.svg" alt="EDOCODE" class="brand-hero-logo" />
    </a>
  </header>

  <!-- Main Stage: Perfectly Centered, Clean OLED Black -->
  <main>
    <div class="spinner-wrapper" id="spinner-container" title="Click logo to spin faster like a fidget spinner!">

      <!-- Master SVG Stage: viewBox centered at (0, 0) with generous clearance -->
      <svg class="spinner-svg" id="spinner-svg" viewBox="-1400 -1400 2800 2800">

        <!-- ======================================================== -->
        <!-- SPINNING ROTOR: Palindromic EDO (left) and ODE (right)   -->
        <!-- Dynamic docking gap:                                     -->
        <!--   - Spinning: expands outward by +80px for clearance     -->
        <!--   - Stopped: retracts inward to tight 40px kerning gap   -->
        <!-- ======================================================== -->
        <g id="spinner-rotor" transform="rotate(0)">
          
          <!-- LEFT WING: E D O (starts at -1110, inner O ends at -200) -->
          <g id="wing-edo" transform="translate(0, 0)">
            <!-- Letter E (-1110 to -850) -->
            <path d="
              M 0 20 A 20 20 0 0 1 20 0 L 244 0 A 16 16 0 0 1 260 16 L 260 64 A 16 16 0 0 1 244 80 L 88 80 A 8 8 0 0 0 80 88 L 80 112 A 8 8 0 0 0 88 120 L 244 120 A 16 16 0 0 1 260 136 L 260 184 A 16 16 0 0 1 244 200 L 88 200 A 8 8 0 0 0 80 208 L 80 232 A 8 8 0 0 0 88 240 L 244 240 A 16 16 0 0 1 260 256 L 260 304 A 16 16 0 0 1 244 320 L 20 320 A 20 20 0 0 1 0 300 Z
            " fill="#FFFFFF" transform="translate(-1110, -160)"/>
            
            <!-- Letter D (-810 to -530) -->
            <path d="
              M 0 20 A 20 20 0 0 1 20 0 L 160 0 A 120 120 0 0 1 280 120 L 280 200 A 120 120 0 0 1 160 320 L 20 320 A 20 20 0 0 1 0 300 Z 
              M 88 80 L 160 80 A 40 40 0 0 1 200 120 L 200 200 A 40 40 0 0 1 160 240 L 88 240 A 8 8 0 0 1 80 232 L 80 88 A 8 8 0 0 1 88 80 Z
            " fill="#FFFFFF" fill-rule="evenodd" transform="translate(-810, -160)"/>

            <!-- Letter O (-490 to -200) -->
            <path d="
              M 60 0 L 230 0 A 60 60 0 0 1 290 60 L 290 260 A 60 60 0 0 1 230 320 L 60 320 A 60 60 0 0 1 0 260 L 0 60 A 60 60 0 0 1 60 0 Z 
              M 96 80 L 194 80 A 16 16 0 0 1 210 96 L 210 224 A 16 16 0 0 1 194 240 L 96 240 A 16 16 0 0 1 80 224 L 80 96 A 16 16 0 0 1 96 80 Z
            " fill="#FFFFFF" fill-rule="evenodd" transform="translate(-490, -160)"/>
          </g>

          <!-- RIGHT WING: O D E (inner O starts at +200, ends at +1110) -->
          <!-- Point reflection of E D O across (0, 0) -->
          <g id="wing-ode" transform="translate(0, 0)">
            <!-- Letter O (+200 to +490) -->
            <path d="
              M 60 0 L 230 0 A 60 60 0 0 1 290 60 L 290 260 A 60 60 0 0 1 230 320 L 60 320 A 60 60 0 0 1 0 260 L 0 60 A 60 60 0 0 1 60 0 Z 
              M 96 80 L 194 80 A 16 16 0 0 1 210 96 L 210 224 A 16 16 0 0 1 194 240 L 96 240 A 16 16 0 0 1 80 224 L 80 96 A 16 16 0 0 1 96 80 Z
            " fill="#FFFFFF" fill-rule="evenodd" transform="translate(200, -160)"/>

            <!-- Letter D (+530 to +810) -->
            <path d="
              M 0 20 A 20 20 0 0 1 20 0 L 160 0 A 120 120 0 0 1 280 120 L 280 200 A 120 120 0 0 1 160 320 L 20 320 A 20 20 0 0 1 0 300 Z 
              M 88 80 L 160 80 A 40 40 0 0 1 200 120 L 200 200 A 40 40 0 0 1 160 240 L 88 240 A 8 8 0 0 1 80 232 L 80 88 A 8 8 0 0 1 88 80 Z
            " fill="#FFFFFF" fill-rule="evenodd" transform="translate(530, -160)"/>

            <!-- Letter E (+850 to +1110) -->
            <path d="
              M 0 20 A 20 20 0 0 1 20 0 L 244 0 A 16 16 0 0 1 260 16 L 260 64 A 16 16 0 0 1 244 80 L 88 80 A 8 8 0 0 0 80 88 L 80 112 A 8 8 0 0 0 88 120 L 244 120 A 16 16 0 0 1 260 136 L 260 184 A 16 16 0 0 1 244 200 L 88 200 A 8 8 0 0 0 80 208 L 80 232 A 8 8 0 0 0 88 240 L 244 240 A 16 16 0 0 1 260 256 L 260 304 A 16 16 0 0 1 244 320 L 20 320 A 20 20 0 0 1 0 300 Z
            " fill="#FFFFFF" transform="translate(850, -160)"/>
          </g>
        </g>

        <!-- ======================================================== -->
        <!-- STATIC CENTER LOGO: Clean, Pure OLED Black (No Circles) -->
        <!-- Spans [-160, 160] x [-160, 160] (320x320)                -->
        <!-- ======================================================== -->
        <g id="static-center-logo">
          <!-- Official Brand Kit Mark: Outer Green Bracket + Inner White C/E -->
          <g transform="translate(-160, -160)">
            <!-- Outer Green L-Bracket #25D366 -->
            <path d="
              M 0 20
              A 20 20 0 0 1 20 0
              L 304 0
              A 16 16 0 0 1 320 16
              L 320 64
              A 16 16 0 0 1 304 80
              L 88 80
              A 8 8 0 0 0 80 88
              L 80 304
              A 16 16 0 0 1 64 320
              L 16 320
              A 16 16 0 0 1 0 304
              Z
            " fill="#25D366" />

            <!-- Inner White Emblem #FFFFFF -->
            <path d="
              M 304 120
              A 16 16 0 0 1 320 136
              L 320 184
              A 16 16 0 0 1 304 200
              L 208 200
              A 8 8 0 0 0 200 208
              L 200 232
              A 8 8 0 0 0 208 240
              L 304 240
              A 16 16 0 0 1 320 256
              L 320 304
              A 16 16 0 0 1 304 320
              L 140 320
              A 20 20 0 0 1 120 300
              L 120 140
              A 20 20 0 0 1 140 120
              Z
            " fill="#FFFFFF" />
          </g>
        </g>
      </svg>
    </div>

    <!-- Rectangular Stop & Align Button -->
    <div class="controls-container">
      <button class="btn-rect" id="btn-toggle-spin">
        <span id="btn-icon">⏸</span>
        <span id="btn-text">STOP &amp; ALIGN</span>
      </button>
    </div>
  </main>

  <!-- Floating Dynamic Cursor Tooltip -->
  <div class="cursor-pill" id="cursor-pill">
    <span class="icon">🌀</span>
    <span class="text" id="cursor-text">CLICK TO SPIN <span class="highlight">FASTER</span></span>
  </div>

  <script>
    // --- Physics & Rotation State ---
    // 8.00s per rotation = 360 deg / 8s = 45 deg/sec (7.5 RPM)
    const CRUISE_SPEED = 45; 
    let currentSpeed = CRUISE_SPEED;
    let targetSpeed = CRUISE_SPEED;
    let angle = 0;
    
    let isStopped = false;
    let isAligning = false;
    let alignTargetAngle = 0;

    // Dynamic wing offset:
    // 0 = stopped state (docked tight: 40px kerning gap between letters and logo)
    // 80 = spinning state (expanded outward: 120px gap for full rotation clearance)
    let wingOffset = 80;

    const rotor = document.getElementById('spinner-rotor');
    const wingEdo = document.getElementById('wing-edo');
    const wingOde = document.getElementById('wing-ode');
    const svgElement = document.getElementById('spinner-svg');
    const container = document.getElementById('spinner-container');
    const btnToggle = document.getElementById('btn-toggle-spin');
    const btnIcon = document.getElementById('btn-icon');
    const btnText = document.getElementById('btn-text');
    const cursorPill = document.getElementById('cursor-pill');
    const cursorText = document.getElementById('cursor-text');

    // --- Web Audio Synthesizer (Realistic Ceramic Bearing Whir) ---
    let audioCtx = null;
    let whirOsc = null;
    let whirGain = null;

    function initAudio() {
      if (audioCtx) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        
        whirOsc = audioCtx.createOscillator();
        whirOsc.type = 'triangle';
        whirOsc.frequency.setValueAtTime(50, audioCtx.currentTime);

        whirGain = audioCtx.createGain();
        whirGain.gain.setValueAtTime(0.001, audioCtx.currentTime);

        whirOsc.connect(whirGain);
        whirGain.connect(audioCtx.destination);
        whirOsc.start();
      } catch (e) {}
    }

    function playClickPop(pitchMult = 1.0) {
      initAudio();
      if (!audioCtx) return;

      try {
        const popOsc = audioCtx.createOscillator();
        const popGain = audioCtx.createGain();

        popOsc.type = 'sine';
        const startFreq = 320 * pitchMult;
        popOsc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
        popOsc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.1);

        popGain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        popGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

        popOsc.connect(popGain);
        popGain.connect(audioCtx.destination);

        popOsc.start();
        popOsc.stop(audioCtx.currentTime + 0.11);
      } catch (e) {}
    }

    function updateAudioWhir(speed) {
      if (!whirGain || !whirOsc || !audioCtx) return;
      const rpm = (speed / 360) * 60;
      const targetFreq = Math.min(850, 50 + rpm * 0.4);
      const targetVol = isStopped ? 0.001 : Math.min(0.06, Math.max(0.001, (rpm - 7.5) * 0.00012));

      whirOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
      whirGain.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.1);
    }

    // --- Particle Spark System ---
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function spawnSparks(x, y, count = 14, speedMult = 1) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const velocity = (Math.random() * 5 + 2) * speedMult;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(a) * velocity,
          vy: Math.sin(a) * velocity,
          size: Math.random() * 3 + 1.5,
          alpha: 1.0,
          decay: Math.random() * 0.03 + 0.02,
          color: Math.random() > 0.35 ? '#25D366' : '#FFFFFF'
        });
      }
    }

    function updateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        p.size *= 0.96;

        if (p.alpha <= 0 || p.size < 0.4) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // --- Fidget Spinner Acceleration on Click ---
    function accelerate(boostAmount = 380, clientX = null, clientY = null) {
      // If currently stopped, resume spinning smoothly
      if (isStopped || isAligning) {
        startSpinning();
      }

      targetSpeed += boostAmount;
      if (targetSpeed > 14000) targetSpeed = 14000;

      const rpm = (targetSpeed / 360) * 60;
      playClickPop(Math.min(2.5, 1.0 + rpm / 400));

      const rect = svgElement.getBoundingClientRect();
      const sparkX = clientX !== null ? clientX : (rect.left + rect.width / 2);
      const sparkY = clientY !== null ? clientY : (rect.top + rect.height / 2);
      spawnSparks(sparkX, sparkY, Math.min(26, 10 + Math.floor(rpm / 50)), Math.min(3.5, 1 + rpm / 250));

      svgElement.style.transform = 'scale(1.025)';
      setTimeout(() => { svgElement.style.transform = 'scale(1)'; }, 90);
    }

    container.addEventListener('pointerdown', (e) => {
      accelerate(420, e.clientX, e.clientY);
    });

    // --- Stop & Align Button Logic ---
    function stopAndAlign() {
      isAligning = true;
      isStopped = false;
      
      // Calculate next upright horizontal landing (clean multiple of 360 deg)
      const currentRev = angle / 360;
      alignTargetAngle = Math.ceil(currentRev + 0.35) * 360;
      
      btnToggle.classList.add('stopped');
      btnIcon.textContent = '▶';
      btnText.textContent = 'START SPINNER';
    }

    function startSpinning() {
      isAligning = false;
      isStopped = false;
      targetSpeed = CRUISE_SPEED;
      currentSpeed = 25; // Smooth startup ramp

      btnToggle.classList.remove('stopped');
      btnIcon.textContent = '⏸';
      btnText.textContent = 'STOP & ALIGN';
    }

    btnToggle.addEventListener('click', () => {
      if (isStopped || isAligning) {
        startSpinning();
      } else {
        stopAndAlign();
      }
    });

    // --- Dynamic Cursor Tooltip ---
    let mouseX = -200, mouseY = -200;
    window.addEventListener('pointermove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursorPill.style.transform = `translate(${mouseX + 16}px, ${mouseY - 48}px)`;
      cursorPill.classList.add('visible');
    });

    document.addEventListener('pointerleave', () => {
      cursorPill.classList.remove('visible');
    });

    // --- Main Physics Loop ---
    let lastTime = performance.now();

    function tick(now) {
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      if (isAligning) {
        // Ultra-smooth cubic ease-out alignment deceleration towards alignTargetAngle (0 deg horizontal)
        const dist = alignTargetAngle - angle;
        if (dist > 0.15) {
          const step = Math.max(0.4, dist * 0.085);
          angle += step;
        } else {
          // Snapped exactly straight at 0 deg!
          angle = 0;
          isAligning = false;
          isStopped = true;
          currentSpeed = 0;
          targetSpeed = 0;
        }
      } else if (!isStopped) {
        // Skateboard ceramic bearing damping towards CRUISE_SPEED (45 deg/sec = 8s per rotation)
        if (targetSpeed > CRUISE_SPEED) {
          const friction = Math.max(0.985, 1 - (delta * 0.4));
          targetSpeed = CRUISE_SPEED + (targetSpeed - CRUISE_SPEED) * friction;
        }

        currentSpeed += (targetSpeed - currentSpeed) * Math.min(1, delta * 12);
        angle = (angle + currentSpeed * delta) % 360;
      }

      // Smooth hydraulic wing docking animation:
      // When stopped or aligning: targetOffset = 0 (docked tight: 40px kerning gap)
      // When spinning: targetOffset = 80 (expanded for diagonal clearance)
      const targetOffset = (isStopped || isAligning) ? 0 : 80;
      wingOffset += (targetOffset - wingOffset) * Math.min(1, delta * 7);

      // Apply wing offsets
      wingEdo.setAttribute('transform', `translate(${-wingOffset.toFixed(2)}, 0)`);
      wingOde.setAttribute('transform', `translate(${wingOffset.toFixed(2)}, 0)`);

      // Apply rotation to SVG rotor
      rotor.setAttribute('transform', `rotate(${angle.toFixed(2)})`);

      // Update Cursor Pill text
      const rpm = Math.round((currentSpeed / 360) * 60);
      if (isStopped) {
        cursorText.innerHTML = `ALIGNED HORIZONTALLY • <span class="highlight">CLICK TO SPIN</span>`;
      } else if (rpm >= 300) {
        cursorText.innerHTML = `⚡ <span class="highlight">SUPERSONIC SPINNER!</span> (${rpm} RPM)`;
      } else if (rpm > 12) {
        cursorText.innerHTML = `🔥 <span class="highlight">SPINNING FAST!</span> (${rpm} RPM)`;
      } else {
        cursorText.innerHTML = `CRUISING (8s/rot) • <span class="highlight">CLICK TO SPIN FASTER</span>`;
      }

      // Hyperspin glow
      if (rpm > 280) {
        svgElement.classList.add('hyperspin');
      } else {
        svgElement.classList.remove('hyperspin');
      }

      updateAudioWhir(currentSpeed);
      updateParticles();

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
