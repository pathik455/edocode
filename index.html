<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EDOCODE • Palindromic Fidget Spinner</title>
  <meta name="description" content="EDOCODE — Static brand mark with spinning palindromic EDO and ODE wings.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --green: #25D366;
      --green-glow: rgba(37, 211, 102, 0.45);
      --green-subtle: rgba(37, 211, 102, 0.12);
      --white: #FFFFFF;
      --gray-400: #888888;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--white);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      position: relative;
      cursor: crosshair;
    }

    /* Ambient background grid */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(37, 211, 102, 0.10) 0%, transparent 65%),
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 100% 100%, 48px 48px, 48px 48px;
      pointer-events: none;
      z-index: 1;
    }

    /* Particle canvas for sparks */
    #particles-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Minimalist Top Header */
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .brand-tag {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--white);
      pointer-events: auto;
    }

    .brand-tag svg {
      width: 30px;
      height: 30px;
    }

    .brand-tag .title {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.12em;
      color: var(--white);
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--gray-400);
      backdrop-filter: blur(12px);
      pointer-events: auto;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
      animation: pulse-dot 2s infinite ease-in-out;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    /* Main Container: Perfectly Centered, NEVER Cuts the Screen */
    main {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* Square Responsive Spinner Wrapper: Fits viewport width & height */
    .spinner-wrapper {
      position: relative;
      /* Constrained by BOTH viewport width and height to guarantee zero clipping */
      width: min(80vw, 80vh);
      height: min(80vw, 80vh);
      max-width: 820px;
      max-height: 820px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    /* Subtle Bearing Orbit Guides */
    .orbit-ring {
      position: absolute;
      width: 90%;
      height: 90%;
      border-radius: 50%;
      border: 1px dashed rgba(37, 211, 102, 0.18);
      pointer-events: none;
      animation: ring-rotate 12s infinite linear;
    }

    .orbit-ring.outer {
      width: 100%;
      height: 100%;
      border: 1px solid rgba(255, 255, 255, 0.04);
      animation: ring-rotate-rev 18s infinite linear;
    }

    @keyframes ring-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes ring-rotate-rev {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    /* SVG Master Stage */
    .spinner-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.9));
      transition: filter 0.15s ease-out;
    }

    .spinner-svg.hyperspin {
      filter: drop-shadow(0 0 45px var(--green-glow)) drop-shadow(0 20px 60px rgba(0, 0, 0, 0.95));
    }

    /* Floating Subtle Instruction Badge under Spinner */
    .instruction-badge {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(37, 211, 102, 0.08);
      border: 1px solid var(--green);
      box-shadow: 0 0 25px var(--green-subtle);
      padding: 8px 22px;
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--white);
      cursor: pointer;
      animation: badge-pulse 2.2s infinite ease-in-out;
      transition: all 0.2s ease;
    }

    .instruction-badge .icon {
      color: var(--green);
      font-size: 13px;
    }

    @keyframes badge-pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(37, 211, 102, 0.15); }
      50% { transform: scale(1.025); box-shadow: 0 0 30px rgba(37, 211, 102, 0.4); }
    }

    /* Floating Interactive Cursor Pill */
    .cursor-pill {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1000;
      background: rgba(10, 10, 10, 0.92);
      border: 1px solid var(--green);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 25px var(--green-glow);
      backdrop-filter: blur(16px);
      padding: 8px 16px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      transition: opacity 0.2s ease;
      opacity: 0;
      transform: translate(-50%, -140%);
    }

    .cursor-pill.visible {
      opacity: 1;
    }

    .cursor-pill .icon {
      font-size: 13px;
      display: inline-block;
      animation: spin-icon 1.2s infinite linear;
    }

    @keyframes spin-icon {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .cursor-pill .text {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--white);
    }

    .cursor-pill .highlight {
      color: var(--green);
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      header {
        padding: 16px 20px;
      }
      .spinner-wrapper {
        width: min(88vw, 88vh);
        height: min(88vw, 88vh);
      }
      .cursor-pill {
        display: none;
      }
      .instruction-badge {
        font-size: 10px;
        padding: 6px 16px;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Background Grid & Particle Canvas -->
  <div class="bg-grid"></div>
  <canvas id="particles-canvas"></canvas>

  <!-- Top Minimalist Brand Bar -->
  <header>
    <a href="https://edocode.co.in" class="brand-tag" title="EDOCODE Systems">
      <svg viewBox="0 0 320 320" fill="none">
        <path d="M 0 20 A 20 20 0 0 1 20 0 L 300 0 A 20 20 0 0 1 320 20 L 320 70 A 20 20 0 0 1 300 90 L 110 90 A 20 20 0 0 0 90 110 L 90 300 A 20 20 0 0 1 70 320 L 20 320 A 20 20 0 0 1 0 300 Z" fill="#25D366"/>
        <path d="M 120 120 A 10 10 0 0 1 130 110 L 290 110 A 10 10 0 0 1 300 120 L 300 150 A 10 10 0 0 1 290 160 L 180 160 A 10 10 0 0 0 170 170 L 170 200 A 10 10 0 0 0 180 210 L 270 210 A 10 10 0 0 1 280 220 L 280 240 A 10 10 0 0 1 270 250 L 180 250 A 10 10 0 0 0 170 260 L 170 270 A 10 10 0 0 0 180 280 L 290 280 A 10 10 0 0 1 300 290 L 300 310 A 10 10 0 0 1 290 320 L 130 320 A 10 10 0 0 1 120 310 Z" fill="#FFFFFF"/>
      </svg>
      <span class="title">EDOCODE</span>
    </a>

    <div class="status-pill">
      <div class="status-dot"></div>
      <span>SYSTEM ACTIVE • edocode.co.in</span>
    </div>
  </header>

  <!-- Center Stage: Perfectly Centered, Completely Balanced -->
  <main>
    <div class="spinner-wrapper" id="spinner-container" title="Click logo to spin faster like a fidget spinner!">
      <div class="orbit-ring outer"></div>
      <div class="orbit-ring"></div>

      <!-- Master SVG Stage: Symmetrical square viewBox guarantees zero cutting at any angle -->
      <svg class="spinner-svg" id="spinner-svg" viewBox="-1300 -1300 2600 2600">
        <defs>
          <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#25D366" stop-opacity="0.35"/>
            <stop offset="70%" stop-color="#25D366" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#25D366" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- Ambient Center Glow Circle -->
        <circle cx="0" cy="0" r="280" fill="url(#centerGlow)"/>

        <!-- ======================================================== -->
        <!-- SPINNING ROTOR: Palindromic EDO (left) and ODE (right)   -->
        <!-- Rotates around (0, 0) at 2.00s per rotation (30 RPM)     -->
        <!-- ======================================================== -->
        <g id="spinner-rotor" transform="rotate(0)">
          
          <!-- LEFT WING: E D O (Spans -1120 to -210, Height [-160, 160]) -->
          <g id="wing-edo">
            <!-- Letter E (-1120 to -860) -->
            <path d="
              M 0 20 A 20 20 0 0 1 20 0 L 244 0 A 16 16 0 0 1 260 16 L 260 64 A 16 16 0 0 1 244 80 L 88 80 A 8 8 0 0 0 80 88 L 80 112 A 8 8 0 0 0 88 120 L 244 120 A 16 16 0 0 1 260 136 L 260 184 A 16 16 0 0 1 244 200 L 88 200 A 8 8 0 0 0 80 208 L 80 232 A 8 8 0 0 0 88 240 L 244 240 A 16 16 0 0 1 260 256 L 260 304 A 16 16 0 0 1 244 320 L 20 320 A 20 20 0 0 1 0 300 Z
            " fill="#FFFFFF" transform="translate(-1120, -160)"/>
            
            <!-- Letter D (-820 to -540) -->
            <path d="
              M 0 20 A 20 20 0 0 1 20 0 L 160 0 A 120 120 0 0 1 280 120 L 280 200 A 120 120 0 0 1 160 320 L 20 320 A 20 20 0 0 1 0 300 Z 
              M 88 80 L 160 80 A 40 40 0 0 1 200 120 L 200 200 A 40 40 0 0 1 160 240 L 88 240 A 8 8 0 0 1 80 232 L 80 88 A 8 8 0 0 1 88 80 Z
            " fill="#FFFFFF" fill-rule="evenodd" transform="translate(-820, -160)"/>

            <!-- Letter O (-500 to -210) -->
            <path d="
              M 60 0 L 230 0 A 60 60 0 0 1 290 60 L 290 260 A 60 60 0 0 1 230 320 L 60 320 A 60 60 0 0 1 0 260 L 0 60 A 60 60 0 0 1 60 0 Z 
              M 96 80 L 194 80 A 16 16 0 0 1 210 96 L 210 224 A 16 16 0 0 1 194 240 L 96 240 A 16 16 0 0 1 80 224 L 80 96 A 16 16 0 0 1 96 80 Z
            " fill="#FFFFFF" fill-rule="evenodd" transform="translate(-500, -160)"/>
          </g>

          <!-- RIGHT WING: O D E (Spans +210 to +1120, Height [-160, 160]) -->
          <!-- Palindromic point reflection of E D O across (0, 0) -->
          <g id="wing-ode">
            <!-- Letter O (+210 to +500) -->
            <path d="
              M 60 0 L 230 0 A 60 60 0 0 1 290 60 L 290 260 A 60 60 0 0 1 230 320 L 60 320 A 60 60 0 0 1 0 260 L 0 60 A 60 60 0 0 1 60 0 Z 
              M 96 80 L 194 80 A 16 16 0 0 1 210 96 L 210 224 A 16 16 0 0 1 194 240 L 96 240 A 16 16 0 0 1 80 224 L 80 96 A 16 16 0 0 1 96 80 Z
            " fill="#FFFFFF" fill-rule="evenodd" transform="translate(210, -160)"/>

            <!-- Letter D (+540 to +820) -->
            <path d="
              M 0 20 A 20 20 0 0 1 20 0 L 160 0 A 120 120 0 0 1 280 120 L 280 200 A 120 120 0 0 1 160 320 L 20 320 A 20 20 0 0 1 0 300 Z 
              M 88 80 L 160 80 A 40 40 0 0 1 200 120 L 200 200 A 40 40 0 0 1 160 240 L 88 240 A 8 8 0 0 1 80 232 L 80 88 A 8 8 0 0 1 88 80 Z
            " fill="#FFFFFF" fill-rule="evenodd" transform="translate(540, -160)"/>

            <!-- Letter E (+860 to +1120) -->
            <path d="
              M 0 20 A 20 20 0 0 1 20 0 L 244 0 A 16 16 0 0 1 260 16 L 260 64 A 16 16 0 0 1 244 80 L 88 80 A 8 8 0 0 0 80 88 L 80 112 A 8 8 0 0 0 88 120 L 244 120 A 16 16 0 0 1 260 136 L 260 184 A 16 16 0 0 1 244 200 L 88 200 A 8 8 0 0 0 80 208 L 80 232 A 8 8 0 0 0 88 240 L 244 240 A 16 16 0 0 1 260 256 L 260 304 A 16 16 0 0 1 244 320 L 20 320 A 20 20 0 0 1 0 300 Z
            " fill="#FFFFFF" transform="translate(860, -160)"/>
          </g>
        </g>

        <!-- ======================================================== -->
        <!-- STATIC CENTER LOGO: Official Brand Emblem edocode-mark   -->
        <!-- Stays stationary, perfectly upright in the middle (0, 0) -->
        <!-- Spans [-160, 160] x [-160, 160] (320x320)                -->
        <!-- ======================================================== -->
        <g id="static-center-logo">
          <!-- Bearing Mount / Dark Backdrop Circle -->
          <circle cx="0" cy="0" r="185" fill="#000000" stroke="#25D366" stroke-width="3.5"/>
          <circle cx="0" cy="0" r="176" fill="#000000" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

          <!-- Official Brand Kit Mark: Outer Green Bracket + Inner White C/E -->
          <g transform="translate(-160, -160)">
            <!-- Outer Green L-Bracket #25D366 -->
            <path d="
              M 0 20
              A 20 20 0 0 1 20 0
              L 304 0
              A 16 16 0 0 1 320 16
              L 320 64
              A 16 16 0 0 1 304 80
              L 88 80
              A 8 8 0 0 0 80 88
              L 80 304
              A 16 16 0 0 1 64 320
              L 16 320
              A 16 16 0 0 1 0 304
              Z
            " fill="#25D366" />

            <!-- Inner White Emblem #FFFFFF -->
            <path d="
              M 304 120
              A 16 16 0 0 1 320 136
              L 320 184
              A 16 16 0 0 1 304 200
              L 208 200
              A 8 8 0 0 0 200 208
              L 200 232
              A 8 8 0 0 0 208 240
              L 304 240
              A 16 16 0 0 1 320 256
              L 320 304
              A 16 16 0 0 1 304 320
              L 140 320
              A 20 20 0 0 1 120 300
              L 120 140
              A 20 20 0 0 1 140 120
              Z
            " fill="#FFFFFF" />
          </g>
        </g>
      </svg>
    </div>

    <!-- Minimal Instruction Badge -->
    <div class="instruction-badge" id="instruction-badge">
      <span class="icon">🌀</span>
      <span>CLICK LOGO TO SPIN FASTER LIKE A FIDGET SPINNER</span>
    </div>
  </main>

  <!-- Floating Dynamic Cursor Tooltip -->
  <div class="cursor-pill" id="cursor-pill">
    <span class="icon">🌀</span>
    <span class="text">CLICK TO SPIN <span class="highlight">FASTER</span> (<span id="cursor-rpm">30 RPM</span>)</span>
  </div>

  <script>
    // --- Physics & Spin State ---
    const BASE_SPEED = 180; // 180 deg/s = exactly 360 deg every 2.00s (30 RPM cruise)
    let currentSpeed = BASE_SPEED;
    let targetSpeed = BASE_SPEED;
    let angle = 0;

    const rotor = document.getElementById('spinner-rotor');
    const svgElement = document.getElementById('spinner-svg');
    const container = document.getElementById('spinner-container');
    const instructionBadge = document.getElementById('instruction-badge');
    const cursorPill = document.getElementById('cursor-pill');
    const cursorRpm = document.getElementById('cursor-rpm');

    // --- Web Audio Synthesizer (Realistic Ceramic Skateboard Bearing Whir) ---
    let audioCtx = null;
    let whirOsc = null;
    let whirGain = null;

    function initAudio() {
      if (audioCtx) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        
        whirOsc = audioCtx.createOscillator();
        whirOsc.type = 'triangle';
        whirOsc.frequency.setValueAtTime(60, audioCtx.currentTime);

        whirGain = audioCtx.createGain();
        whirGain.gain.setValueAtTime(0.001, audioCtx.currentTime);

        whirOsc.connect(whirGain);
        whirGain.connect(audioCtx.destination);
        whirOsc.start();
      } catch (e) {}
    }

    function playClickPop(pitchMult = 1.0) {
      initAudio();
      if (!audioCtx) return;

      try {
        const popOsc = audioCtx.createOscillator();
        const popGain = audioCtx.createGain();

        popOsc.type = 'sine';
        const startFreq = 340 * pitchMult;
        popOsc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
        popOsc.frequency.exponentialRampToValueAtTime(75, audioCtx.currentTime + 0.1);

        popGain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        popGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

        popOsc.connect(popGain);
        popGain.connect(audioCtx.destination);

        popOsc.start();
        popOsc.stop(audioCtx.currentTime + 0.11);
      } catch (e) {}
    }

    function updateAudioWhir(speed) {
      if (!whirGain || !whirOsc || !audioCtx) return;
      const rpm = (speed / 360) * 60;
      const targetFreq = Math.min(850, 70 + rpm * 0.4);
      const targetVol = Math.min(0.065, Math.max(0.001, (rpm - 30) * 0.00012));

      whirOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
      whirGain.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.1);
    }

    // --- Particle Spark System ---
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function spawnSparks(x, y, count = 14, speedMult = 1) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const velocity = (Math.random() * 5 + 2) * speedMult;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * velocity,
          vy: Math.sin(angle) * velocity,
          size: Math.random() * 3 + 1.5,
          alpha: 1.0,
          decay: Math.random() * 0.03 + 0.02,
          color: Math.random() > 0.35 ? '#25D366' : '#FFFFFF'
        });
      }
    }

    function updateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        p.size *= 0.96;

        if (p.alpha <= 0 || p.size < 0.4) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // --- Fidget Spinner Acceleration on Click ---
    function accelerate(boostAmount = 420, clientX = null, clientY = null) {
      targetSpeed += boostAmount;
      if (targetSpeed > 14000) targetSpeed = 14000;

      const rpm = (targetSpeed / 360) * 60;
      playClickPop(Math.min(2.5, 1.0 + rpm / 400));

      const rect = svgElement.getBoundingClientRect();
      const sparkX = clientX !== null ? clientX : (rect.left + rect.width / 2);
      const sparkY = clientY !== null ? clientY : (rect.top + rect.height / 2);
      spawnSparks(sparkX, sparkY, Math.min(26, 10 + Math.floor(rpm / 50)), Math.min(3.5, 1 + rpm / 250));

      // Visual pulse
      svgElement.style.transform = 'scale(1.025)';
      setTimeout(() => { svgElement.style.transform = 'scale(1)'; }, 90);
    }

    container.addEventListener('pointerdown', (e) => {
      accelerate(450, e.clientX, e.clientY);
    });

    instructionBadge.addEventListener('pointerdown', (e) => {
      accelerate(450, e.clientX, e.clientY);
    });

    // --- Dynamic Cursor Instruction Tooltip ---
    let mouseX = -200, mouseY = -200;
    window.addEventListener('pointermove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursorPill.style.transform = `translate(${mouseX + 16}px, ${mouseY - 48}px)`;
      cursorPill.classList.add('visible');
    });

    document.addEventListener('pointerleave', () => {
      cursorPill.classList.remove('visible');
    });

    // --- Main Physics Animation Loop ---
    let lastTime = performance.now();

    function tick(now) {
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      // Realistic skateboard ceramic bearing damping towards BASE_SPEED (30 RPM cruise)
      if (targetSpeed > BASE_SPEED) {
        const friction = Math.max(0.982, 1 - (delta * 0.45));
        targetSpeed = BASE_SPEED + (targetSpeed - BASE_SPEED) * friction;
      }

      currentSpeed += (targetSpeed - currentSpeed) * Math.min(1, delta * 14);

      // Rotate wings around exact center (0, 0)
      angle = (angle + currentSpeed * delta) % 360;
      rotor.setAttribute('transform', `rotate(${angle.toFixed(2)})`);

      const rpm = Math.round((currentSpeed / 360) * 60);
      cursorRpm.textContent = `${rpm.toLocaleString()} RPM`;

      // Hyperspin glow
      if (rpm > 280) {
        svgElement.classList.add('hyperspin');
      } else {
        svgElement.classList.remove('hyperspin');
      }

      // Cursor message dynamics
      if (rpm >= 800) {
        cursorPill.querySelector('.text').innerHTML = `⚡ <span class="highlight">SUPERSONIC SPINNER!</span> (${rpm} RPM)`;
      } else if (rpm >= 240) {
        cursorPill.querySelector('.text').innerHTML = `🔥 <span class="highlight">SPINNING FAST!</span> (${rpm} RPM)`;
      } else {
        cursorPill.querySelector('.text').innerHTML = `CLICK TO SPIN <span class="highlight">FASTER</span> (${rpm} RPM)`;
      }

      updateAudioWhir(currentSpeed);
      updateParticles();

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
