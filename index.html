<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>EDOCODE • Palindromic Fidget Spinner</title>
  <meta name="description" content="EDOCODE — Static brand mark with spinning palindromic EDO and ODE wings.">
  <link rel="icon" type="image/svg+xml" href="assets/logos/edocode-favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --green: #25D366;
      --green-glow: rgba(37, 211, 102, 0.45);
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--white);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      position: relative;
      cursor: default;
    }

    /* Ambient background grid */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 64px 64px, 64px 64px;
      pointer-events: none;
      z-index: 1;
    }

    /* Particle canvas for 4K game-style rising green gas & sparks */
    #particles-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 6;
    }

    /* Top Brand Bar: Logo in top-left, instruction in top-center */
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 25;
      padding: 28px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .brand-tag {
      display: flex;
      align-items: center;
      text-decoration: none;
      pointer-events: auto;
    }

    /* Top Instruction Pill: High-contrast, clean entry guide */
    .top-instruction {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(10, 10, 10, 0.88);
      border: 1.5px solid rgba(37, 211, 102, 0.4);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), 0 0 16px rgba(37, 211, 102, 0.15);
      padding: 9px 22px;
      border-radius: 999px;
      pointer-events: auto;
      user-select: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
    }

    .top-instruction:hover {
      border-color: var(--green);
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.9), 0 0 24px var(--green-glow);
    }

    .top-instruction.active {
      border-color: var(--green);
      box-shadow: 0 0 22px var(--green-glow);
    }

    .top-instruction.hyperspin {
      border-color: #FFFFFF;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.4), 0 0 35px var(--green-glow);
    }

    .instruction-beacon {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: beacon-pulse 2s infinite ease-in-out;
      flex-shrink: 0;
    }

    @keyframes beacon-pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .instruction-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--white);
      white-space: nowrap;
    }

    /* Refined Wordmark in Top-Left */
    .brand-hero-logo {
      height: 32px;
      width: auto;
      max-width: 170px;
      object-fit: contain;
      filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.8));
      transition: transform 0.22s ease, opacity 0.22s ease;
    }

    .brand-hero-logo:hover {
      transform: scale(1.03);
      opacity: 0.95;
    }

    /* Main Container: Centered stage */
    main {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
      gap: 24px;
    }

    /* Square Responsive Spinner Stage: Sized to fit BOTH width and height */
    .spinner-wrapper {
      position: relative;
      width: min(76vw, 68vh);
      height: min(76vw, 68vh);
      max-width: 720px;
      max-height: 720px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    /* Static Ambient Shadow & Glow: Applied to non-rotating container layer so GPU never re-rasterizes vectors */
    .spinner-wrapper::before {
      content: '';
      position: absolute;
      inset: -6%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 211, 102, 0.10) 0%, rgba(0, 0, 0, 0) 65%);
      pointer-events: none;
      z-index: 0;
      opacity: 0.8;
      transition: opacity 0.3s ease;
    }

    .spinner-wrapper.hyperspin::before {
      opacity: 1;
      background: radial-gradient(circle, rgba(37, 211, 102, 0.24) 0%, rgba(0, 0, 0, 0) 70%);
    }

    /* Master SVG Stage: 100% clean vector rendering, zero rotating filter overhead */
    .spinner-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: none !important;
      position: relative;
      z-index: 1;
      will-change: transform;
    }

    /* Pure Rectangular Stop Button */
    .controls-container {
      position: relative;
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .btn-rect {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #000000;
      border: 1.5px solid var(--green);
      color: var(--white);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 12px 32px;
      border-radius: 0px; /* Pure rectangular shape */
      cursor: pointer;
      box-shadow: 0 0 16px rgba(37, 211, 102, 0.18);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-rect:hover {
      background: var(--green);
      color: #000000;
      box-shadow: 0 0 28px var(--green-glow);
    }

    .btn-rect:active {
      transform: scale(0.97);
    }

    .btn-rect.stopped {
      border-color: #FFFFFF;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.2);
    }

    .btn-rect.stopped:hover {
      background: #FFFFFF;
      color: #000000;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
    }

    /* Big Faded Web-Responsive "COMING SOON" in Footer (Clearly Visible Fade) */
    .bg-coming-soon {
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 900;
      font-size: clamp(42px, 12.5vw, 240px);
      letter-spacing: -0.03em;
      line-height: 0.82;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      z-index: 2;
      user-select: none;
      background: linear-gradient(0deg, 
        rgba(255, 255, 255, 0.65) 0%, 
        rgba(255, 255, 255, 0.38) 45%, 
        rgba(255, 255, 255, 0.12) 80%, 
        rgba(255, 255, 255, 0.0) 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.75;
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      header {
        padding: 16px 20px;
        flex-direction: column;
        align-items: center;
        gap: 0px;
      }
      .brand-tag {
        align-self: flex-start;
      }
      .top-instruction {
        position: static;
        transform: none;
        margin-top: 30px; /* Positioned lower from the logo for balanced mobile hierarchy */
        padding: 8px 18px;
        gap: 8px;
        max-width: calc(100vw - 32px);
      }
      .instruction-text {
        font-size: 10px;
        letter-spacing: 0.08em;
      }
      .brand-hero-logo {
        height: 24px;
        max-width: 130px;
      }
      .spinner-wrapper {
        width: min(86vw, 54vh);
        height: min(86vw, 54vh);
      }
      .btn-rect {
        padding: 10px 24px;
        font-size: 11px;
      }
      .bg-coming-soon {
        bottom: max(0px, env(safe-area-inset-bottom, 0px));
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Grid & Particles -->
  <div class="bg-grid"></div>
  <canvas id="particles-canvas"></canvas>

  <!-- Big Faded Web-Responsive "COMING SOON" Background Text (Reverse Fade) -->
  <div class="bg-coming-soon" aria-hidden="true">COMING SOON</div>

  <!-- Top Brand Bar: Logo in top-left, instruction in top-center -->
  <header>
    <a href="https://edocode.co.in" class="brand-tag" title="EDOCODE">
      <!-- Official Brand Kit edocode-wordmark-hero.svg in Top-Left -->
      <img src="assets/logos/edocode-wordmark-hero.svg" alt="EDOCODE" class="brand-hero-logo" />
    </a>

    <!-- Top Instruction Pill: Spin to enter the website -->
    <div class="top-instruction" id="top-instruction" role="button" tabindex="0" title="Click or spin to enter">
      <span class="instruction-beacon" aria-hidden="true"></span>
      <span class="instruction-text" id="instruction-text">SPIN THE SPINNER TO ENTER THE WEBSITE</span>
    </div>
  </header>

  <!-- Main Stage: Perfectly Centered, Clean OLED Black -->
  <main>
    <div class="spinner-wrapper" id="spinner-container">

      <!-- Master SVG Stage: viewBox centered at (0, 0) with generous clearance -->
      <svg class="spinner-svg" id="spinner-svg" viewBox="-1400 -1400 2800 2800">

        <!-- ======================================================== -->
        <!-- SPINNING ROTOR: Palindromic EDO (left) and ODE (right)   -->
        <!-- Dynamic docking gap:                                     -->
        <!--   - Spinning: expands outward by +80px for clearance     -->
        <!--   - Stopped: retracts inward to tight 40px kerning gap   -->
        <!-- ======================================================== -->
        <g id="spinner-rotor" transform="rotate(0)">
          
          <!-- LEFT WING: E D O (starts at -1110, inner O ends at -200) -->
          <g id="wing-edo" transform="translate(0, 0)">
            <!-- Letter E (-1110 to -850) -->
            <path d="
              M 0 20 A 20 20 0 0 1 20 0 L 244 0 A 16 16 0 0 1 260 16 L 260 64 A 16 16 0 0 1 244 80 L 88 80 A 8 8 0 0 0 80 88 L 80 112 A 8 8 0 0 0 88 120 L 244 120 A 16 16 0 0 1 260 136 L 260 184 A 16 16 0 0 1 244 200 L 88 200 A 8 8 0 0 0 80 208 L 80 232 A 8 8 0 0 0 88 240 L 244 240 A 16 16 0 0 1 260 256 L 260 304 A 16 16 0 0 1 244 320 L 20 320 A 20 20 0 0 1 0 300 Z
            " fill="#FFFFFF" transform="translate(-1110, -160)"/>
            
            <!-- Letter D (-810 to -530) -->
            <path d="
              M 0 20 A 20 20 0 0 1 20 0 L 160 0 A 120 120 0 0 1 280 120 L 280 200 A 120 120 0 0 1 160 320 L 20 320 A 20 20 0 0 1 0 300 Z 
              M 88 80 L 160 80 A 40 40 0 0 1 200 120 L 200 200 A 40 40 0 0 1 160 240 L 88 240 A 8 8 0 0 1 80 232 L 80 88 A 8 8 0 0 1 88 80 Z
            " fill="#FFFFFF" fill-rule="evenodd" transform="translate(-810, -160)"/>

            <!-- Letter O (-490 to -200) -->
            <path d="
              M 60 0 L 230 0 A 60 60 0 0 1 290 60 L 290 260 A 60 60 0 0 1 230 320 L 60 320 A 60 60 0 0 1 0 260 L 0 60 A 60 60 0 0 1 60 0 Z 
              M 96 80 L 194 80 A 16 16 0 0 1 210 96 L 210 224 A 16 16 0 0 1 194 240 L 96 240 A 16 16 0 0 1 80 224 L 80 96 A 16 16 0 0 1 96 80 Z
            " fill="#FFFFFF" fill-rule="evenodd" transform="translate(-490, -160)"/>
          </g>

          <!-- RIGHT WING: O D E (inner O starts at +200, ends at +1110) -->
          <!-- Point reflection of E D O across (0, 0) -->
          <g id="wing-ode" transform="translate(0, 0)">
            <!-- Letter O (+200 to +490) -->
            <path d="
              M 60 0 L 230 0 A 60 60 0 0 1 290 60 L 290 260 A 60 60 0 0 1 230 320 L 60 320 A 60 60 0 0 1 0 260 L 0 60 A 60 60 0 0 1 60 0 Z 
              M 96 80 L 194 80 A 16 16 0 0 1 210 96 L 210 224 A 16 16 0 0 1 194 240 L 96 240 A 16 16 0 0 1 80 224 L 80 96 A 16 16 0 0 1 96 80 Z
            " fill="#FFFFFF" fill-rule="evenodd" transform="translate(200, -160)"/>

            <!-- Letter D (+530 to +810) -->
            <path d="
              M 0 20 A 20 20 0 0 1 20 0 L 160 0 A 120 120 0 0 1 280 120 L 280 200 A 120 120 0 0 1 160 320 L 20 320 A 20 20 0 0 1 0 300 Z 
              M 88 80 L 160 80 A 40 40 0 0 1 200 120 L 200 200 A 40 40 0 0 1 160 240 L 88 240 A 8 8 0 0 1 80 232 L 80 88 A 8 8 0 0 1 88 80 Z
            " fill="#FFFFFF" fill-rule="evenodd" transform="translate(530, -160)"/>

            <!-- Letter E (+850 to +1110) -->
            <path d="
              M 0 20 A 20 20 0 0 1 20 0 L 244 0 A 16 16 0 0 1 260 16 L 260 64 A 16 16 0 0 1 244 80 L 88 80 A 8 8 0 0 0 80 88 L 80 112 A 8 8 0 0 0 88 120 L 244 120 A 16 16 0 0 1 260 136 L 260 184 A 16 16 0 0 1 244 200 L 88 200 A 8 8 0 0 0 80 208 L 80 232 A 8 8 0 0 0 88 240 L 244 240 A 16 16 0 0 1 260 256 L 260 304 A 16 16 0 0 1 244 320 L 20 320 A 20 20 0 0 1 0 300 Z
            " fill="#FFFFFF" transform="translate(850, -160)"/>
          </g>
        </g>

        <!-- ======================================================== -->
        <!-- STATIC CENTER LOGO: Clean, Pure OLED Black (No Circles) -->
        <!-- Spans [-160, 160] x [-160, 160] (320x320)                -->
        <!-- ======================================================== -->
        <g id="static-center-logo">
          <!-- Official Brand Kit Mark: Outer Green Bracket + Inner White C/E -->
          <g transform="translate(-160, -160)">
            <!-- Outer Green L-Bracket #25D366 -->
            <path d="
              M 0 20
              A 20 20 0 0 1 20 0
              L 304 0
              A 16 16 0 0 1 320 16
              L 320 64
              A 16 16 0 0 1 304 80

            " fill="#25D366" />

            <!-- Inner White Emblem #FFFFFF -->
            <path d="
              M 304 120
              A 16 16 0 0 1 320 136
              L 320 184
              A 16 16 0 0 1 304 200
              L 208 200
              A 8 8 0 0 0 200 208
              L 200 232
              A 8 8 0 0 0 208 240
              L 304 240

              L 320 304

      </svg>
    </div>

    <!-- Rectangular Stop & Align Button -->
    <div class="controls-container">
      <button class="btn-rect" id="btn-toggle-spin">
        <span id="btn-icon">⏸</span>
        <span id="btn-text">STOP &amp; ALIGN</span>
      </button>
    </div>
  </main>

  <script>
    // --- Physics & Rotation State ---
    // 8.00s per rotation = 360 deg / 8s = 45 deg/sec (7.5 RPM)
    const CRUISE_SPEED = 45; 
    let currentSpeed = CRUISE_SPEED;
    let targetSpeed = CRUISE_SPEED;
    let angle = 0;
    
    let isStopped = false;
    let isAligning = false;
    let alignTargetAngle = 0;

    // Dynamic wing offset:
    // 0 = stopped state (docked tight: 40px kerning gap between letters and logo)
    // 80 = spinning state (expanded outward: 120px gap for full rotation clearance)
    let wingOffset = 80;

    const rotor = document.getElementById('spinner-rotor');
    const wingEdo = document.getElementById('wing-edo');
    const wingOde = document.getElementById('wing-ode');
    const svgElement = document.getElementById('spinner-svg');
    const container = document.getElementById('spinner-container');
    const btnToggle = document.getElementById('btn-toggle-spin');
    const btnIcon = document.getElementById('btn-icon');
    const btnText = document.getElementById('btn-text');
    const topInstruction = document.getElementById('top-instruction');
    const instructionText = document.getElementById('instruction-text');

    // --- Web Audio Synthesizer (Realistic Ceramic Bearing Whir) ---
    let audioCtx = null;
    let whirOsc = null;
    let whirGain = null;

    function initAudio() {
      if (audioCtx) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        
        whirOsc = audioCtx.createOscillator();
        whirOsc.type = 'triangle';
        whirOsc.frequency.setValueAtTime(50, audioCtx.currentTime);

        whirGain = audioCtx.createGain();
        whirGain.gain.setValueAtTime(0.001, audioCtx.currentTime);

        whirOsc.connect(whirGain);
        whirGain.connect(audioCtx.destination);
        whirOsc.start();
      } catch (e) {}
    }

    function playClickPop(pitchMult = 1.0) {
      initAudio();
      if (!audioCtx) return;

      try {
        const popOsc = audioCtx.createOscillator();
        const popGain = audioCtx.createGain();

        popOsc.type = 'sine';
        const startFreq = 320 * pitchMult;
        popOsc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
        popOsc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.1);

        popGain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        popGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

        popOsc.connect(popGain);
        popGain.connect(audioCtx.destination);

        popOsc.start();
        popOsc.stop(audioCtx.currentTime + 0.11);
      } catch (e) {}
    }

    function updateAudioWhir(speed) {
      if (!whirGain || !whirOsc || !audioCtx) return;
      const rpm = (speed / 360) * 60;
      const targetFreq = Math.min(850, 50 + rpm * 0.4);
      const targetVol = isStopped ? 0.001 : Math.min(0.06, Math.max(0.001, (rpm - 7.5) * 0.00012));

      whirOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
      whirGain.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.1);
    }

    // --- High-Performance Ambient VFX: Rising Green Gas Particles & Sparks ---
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    const sparks = [];
    const gasParticles = [];
    const isMobileDevice = window.innerWidth <= 768 || ('ontouchstart' in window);
    const GAS_COUNT = isMobileDevice ? 22 : 45;

    function createGasParticle(initialSpread = false) {
      const h = window.innerHeight;
      const w = window.innerWidth;

      // Float upwards from ground (h) to 60% up (reaching ceiling at h * 0.40)
      const groundY = h + Math.random() * 30;
      const ceilingY = h * 0.40; // 60% rise from ground

      const y = initialSpread
        ? groundY - Math.random() * (groundY - ceilingY)
        : groundY;

      // Varied radius: fine ambient vapor (1.2px) to luminous gas embers (5.2px)
      const rSeed = Math.random();
      const radius = rSeed > 0.85 
        ? Math.random() * 2.2 + 3.0   // 3.0 - 5.2px hero embers
        : Math.random() * 1.8 + 1.2;  // 1.2 - 3.0px atmospheric vapor

      return {
        baseX: Math.random() * w,
        x: 0,
        y: y,
        groundY: groundY,
        ceilingY: ceilingY,
        // Vertical velocity: varied float speeds (0.35 to 1.15 px/frame)
        vy: Math.random() * 0.75 + 0.38,
        // Gaseous fluid swaying
        swayAmp: Math.random() * 28 + 12,
        swayFreq: Math.random() * 1.6 + 0.7,
        swayPhase: Math.random() * Math.PI * 2,
        radius: radius,
        baseAlpha: Math.random() * 0.45 + 0.35,
        pulseSpeed: Math.random() * 2.5 + 1.0,
        // Color tint: 75% official brand green, 15% electric mint, 10% emerald
        colorType: Math.random() > 0.25 ? 0 : (Math.random() > 0.4 ? 1 : 2)
      };
    }

    function initGasParticles() {
      gasParticles.length = 0;
      for (let i = 0; i < GAS_COUNT; i++) {
        gasParticles.push(createGasParticle(true));
      }
    }

    function resizeCanvas() {
      const mobile = window.innerWidth <= 768 || ('ontouchstart' in window);
      const dpr = mobile ? 1.0 : Math.min(window.devicePixelRatio || 1, 1.5);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      if (ctx.resetTransform) {
        ctx.resetTransform();
      } else {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      }
      ctx.scale(dpr, dpr);
      initGasParticles();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function spawnSparks(x, y, count = 14, speedMult = 1) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const velocity = (Math.random() * 5 + 2) * speedMult;
        sparks.push({
          x: x,
          y: y,
          vx: Math.cos(a) * velocity,
          vy: Math.sin(a) * velocity,
          size: Math.random() * 3 + 1.5,
          alpha: 1.0,
          decay: Math.random() * 0.03 + 0.02,
          color: Math.random() > 0.35 ? '#25D366' : '#FFFFFF'
        });
      }
    }

    function updateParticles(now) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const t = now ? now / 1000 : performance.now() / 1000;

      ctx.clearRect(0, 0, w, h);

      // 1. Draw Rising Green Gas Particles (Zero shadowBlur - pure hardware-accelerated dual-arc glow)
      ctx.save();
      ctx.globalCompositeOperation = 'lighter'; // Additive blending for luminous energy glow

      for (let i = 0; i < gasParticles.length; i++) {
        const p = gasParticles[i];

        // Lift upwards like hot glowing gas
        p.y -= p.vy;

        // Sinusoidal organic fluid drift
        p.x = p.baseX + Math.sin(t * p.swayFreq + p.swayPhase) * p.swayAmp;

        // Progress from ground (0.0) to ceiling at 60% height (1.0)
        const totalDist = p.groundY - p.ceilingY;
        const currentDist = p.groundY - p.y;
        const progress = Math.min(1.0, Math.max(0, currentDist / totalDist));

        let alpha = p.baseAlpha;
        if (progress <= 0.15) {
          alpha = p.baseAlpha * (progress / 0.15);
        } else if (progress > 0.65) {
          const fadeProgress = (1.0 - progress) / 0.35;
          alpha = p.baseAlpha * Math.max(0, fadeProgress * fadeProgress);
        } else {
          alpha = p.baseAlpha * (1 + 0.14 * Math.sin(t * p.pulseSpeed));
        }

        // If reached 60% ceiling or faded out, respawn gracefully at ground
        if (progress >= 1.0 || p.y <= p.ceilingY) {
          Object.assign(p, createGasParticle(false));
          continue;
        }

        if (alpha <= 0.01) continue;

        // Color selection
        let rColor, gColor, bColor;
        if (p.colorType === 0) {
          // Official EDOCODE Neon Green #25D366
          rColor = 37; gColor = 211; bColor = 102;
        } else if (p.colorType === 1) {
          // Electric Mint #34D399
          rColor = 52; gColor = 211; bColor = 153;
        } else {
          // Deep Emerald Jade #10B981
          rColor = 16; gColor = 185; bColor = 129;
        }

        // Outer soft radiant halo (0ms overhead, zero Gaussian blur passes)
        ctx.fillStyle = `rgba(${rColor}, ${gColor}, ${bColor}, ${(alpha * 0.28).toFixed(3)})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius * 2.2, 0, Math.PI * 2);
        ctx.fill();

        // Inner glowing core
        ctx.fillStyle = `rgba(${rColor}, ${gColor}, ${bColor}, ${alpha.toFixed(3)})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();

        // High-end inner core for larger embers
        if (p.radius > 2.8) {
          ctx.fillStyle = `rgba(255, 255, 255, ${(alpha * 0.75).toFixed(3)})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius * 0.45, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();

      // 2. Draw Click Sparks (zero shadowBlur)
      for (let i = sparks.length - 1; i >= 0; i--) {
        const p = sparks[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        p.size *= 0.96;

        if (p.alpha <= 0 || p.size < 0.4) {
          sparks.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // --- Fidget Spinner Acceleration on Click ---
    function accelerate(boostAmount = 380, clientX = null, clientY = null) {
      // If currently stopped, resume spinning smoothly
      if (isStopped || isAligning) {
        startSpinning();
      }

      targetSpeed += boostAmount;
      if (targetSpeed > 14000) targetSpeed = 14000;

      const rpm = (targetSpeed / 360) * 60;
      playClickPop(Math.min(2.5, 1.0 + rpm / 400));

      const rect = svgElement.getBoundingClientRect();
      const sparkX = clientX !== null ? clientX : (rect.left + rect.width / 2);
      const sparkY = clientY !== null ? clientY : (rect.top + rect.height / 2);
      spawnSparks(sparkX, sparkY, Math.min(26, 10 + Math.floor(rpm / 50)), Math.min(3.5, 1 + rpm / 250));

      svgElement.style.transform = 'scale(1.025)';
      setTimeout(() => { svgElement.style.transform = 'scale(1)'; }, 90);
    }

    container.addEventListener('pointerdown', (e) => {
      accelerate(420, e.clientX, e.clientY);
    });

    // Top instruction click to spin
    if (topInstruction) {
      topInstruction.addEventListener('click', () => {
        accelerate(420);
      });
    }

    // --- Stop & Align Button Logic ---
    function stopAndAlign() {
      isAligning = true;
      isStopped = false;
      
      // Calculate next upright horizontal landing (clean multiple of 360 deg)
      const currentRev = angle / 360;
      alignTargetAngle = Math.ceil(currentRev + 0.35) * 360;
      
      btnToggle.classList.add('stopped');
      btnIcon.textContent = '▶';
      btnText.textContent = 'START SPINNER';
    }

    function startSpinning() {
      isAligning = false;
      isStopped = false;
      targetSpeed = CRUISE_SPEED;
      currentSpeed = 25; // Smooth startup ramp

      btnToggle.classList.remove('stopped');
      btnIcon.textContent = '⏸';
      btnText.textContent = 'STOP & ALIGN';
    }

    btnToggle.addEventListener('click', () => {
      if (isStopped || isAligning) {
        startSpinning();
      } else {
        stopAndAlign();
      }
    });

    // --- Dynamic Top Instruction Logic ---
    let lastInstructionState = '';
    function updateTopInstruction(rpm) {
      if (!topInstruction || !instructionText) return;

      let newState = 'idle';
      if (isStopped) {
        newState = 'stopped';
      } else if (rpm > 280) {
        newState = 'hyperspin';
      } else if (rpm > 70) {
        newState = 'spinning';
      }

      // Zero DOM mutations if state hasn't changed
      if (newState === lastInstructionState) return;
      lastInstructionState = newState;

      if (newState === 'stopped') {
        instructionText.textContent = 'SPIN THE SPINNER TO ENTER THE WEBSITE';
        topInstruction.classList.remove('active', 'hyperspin');
      } else if (newState === 'hyperspin') {
        instructionText.innerHTML = '<span style="color:var(--green)">⚡ ACCESS UNLOCKED • ENTERING EDOCODE</span>';
        topInstruction.classList.add('hyperspin');
      } else if (newState === 'spinning') {
        instructionText.innerHTML = '<span style="color:var(--green)">SPINNING TO ENTER...</span>';
        topInstruction.classList.add('active');
        topInstruction.classList.remove('hyperspin');
      } else {
        instructionText.textContent = 'SPIN THE SPINNER TO ENTER THE WEBSITE';
        topInstruction.classList.remove('active', 'hyperspin');
      }
    }

    // --- Main Physics Loop ---
    let lastTime = performance.now();

    function tick(now) {
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      if (isAligning) {
        // Ultra-smooth cubic ease-out alignment deceleration towards alignTargetAngle (0 deg horizontal)
        const dist = alignTargetAngle - angle;
        if (dist > 0.15) {
          const step = Math.max(0.4, dist * 0.085);
          angle += step;
        } else {
          // Snapped exactly straight at 0 deg!
          angle = 0;
          isAligning = false;
          isStopped = true;
          currentSpeed = 0;
          targetSpeed = 0;
        }
      } else if (!isStopped) {
        // Skateboard ceramic bearing damping towards CRUISE_SPEED (45 deg/sec = 8s per rotation)
        if (targetSpeed > CRUISE_SPEED) {
          const friction = Math.max(0.985, 1 - (delta * 0.4));
          targetSpeed = CRUISE_SPEED + (targetSpeed - CRUISE_SPEED) * friction;
        }

        currentSpeed += (targetSpeed - currentSpeed) * Math.min(1, delta * 12);
        angle = (angle + currentSpeed * delta) % 360;
      }

      // Smooth hydraulic wing docking animation:
      // When stopped or aligning: targetOffset = 0 (docked tight: 40px kerning gap)
      // When spinning: targetOffset = 80 (expanded for diagonal clearance)
      const targetOffset = (isStopped || isAligning) ? 0 : 80;
      wingOffset += (targetOffset - wingOffset) * Math.min(1, delta * 7);

      // Apply wing offsets
      wingEdo.setAttribute('transform', `translate(${-wingOffset.toFixed(2)}, 0)`);
      wingOde.setAttribute('transform', `translate(${wingOffset.toFixed(2)}, 0)`);

      // Apply rotation to SVG rotor
      rotor.setAttribute('transform', `rotate(${angle.toFixed(2)})`);

      const rpm = Math.round((currentSpeed / 360) * 60);

      // Hyperspin glow on static container layer (never causes vector re-rasterization)
      if (rpm > 280) {
        container.classList.add('hyperspin');
      } else {
        container.classList.remove('hyperspin');
      }

      updateTopInstruction(rpm);
      updateAudioWhir(currentSpeed);
      updateParticles(now);

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
